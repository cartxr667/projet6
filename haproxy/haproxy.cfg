global
    log stdout format raw local0
    maxconn 2048

defaults
    log     global
    option  tcplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# ---------------------------------------------------------------
# Frontend HTTP : répartition des requêtes web vers app1 / app2
# ---------------------------------------------------------------
frontend http_apps
    bind *:80
    mode http
    option httplog
    default_backend apps

backend apps
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server app1 192.168.56.10:5000 check inter 2s fall 3 rise 2
    server app2 192.168.56.11:5000 check inter 2s fall 3 rise 2

# ---------------------------------------------------------------
# Frontend TCP 5432 : écritures vers le primaire pg1
# ---------------------------------------------------------------
frontend pg_write
    bind *:5432
    mode tcp
    default_backend pg_primary

backend pg_primary
    mode tcp
    server pg1 192.168.56.20:5432

# ---------------------------------------------------------------
# Frontend TCP 5433 : lectures vers la réplique pg2
# ---------------------------------------------------------------
frontend pg_read
    bind *:5433
    mode tcp
    default_backend pg_replica

backend pg_replica
    mode tcp
    server pg2 192.168.56.21:5432

# ---------------------------------------------------------------
# Stats (protégé par mot de passe, exigence 6.5)
# ---------------------------------------------------------------
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth admin:motdepasse_stats_haproxy